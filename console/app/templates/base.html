<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Agents{% endblock %} · Console de la messagerie</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <strong>Console d'administration de la messagerie</strong>
    {% if admin %}
    <nav>
      <a href="/">Annuaire</a>
      <a href="/enroler">Enrôler un agent</a>
      <a href="/journal">Journal d'audit</a>
      <form method="post" action="/deconnexion">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button>Se déconnecter ({{ admin }})</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>{% block contenu %}{% endblock %}</main>
</body>
</html>
